<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Threadlings — prototype</title>
<style>
  :root { --bg:#11131d; --panel:#1a1d2b; --line:#2a2e44; --txt:#f2f3f8; --mut:#9aa0bb; --pink:#ff78aa; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  #app { max-width:460px; margin:0 auto; min-height:100%; padding:14px 14px 18px; display:flex; flex-direction:column; }
  section[hidden], .overlay[hidden] { display:none !important; }
  h1 { font-size:44px; margin:18px 0 4px; letter-spacing:1px; text-align:center; }
  .tag { text-align:center; color:var(--mut); margin:0 0 22px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .wh { grid-column:1 / -1; margin:14px 0 2px; color:var(--mut); font-weight:700; font-size:14px; letter-spacing:.5px; }
  .lv { aspect-ratio:1; border-radius:14px; border:2px solid var(--line); background:var(--panel); color:var(--txt);
    font-size:20px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; }
  .lv small { font-size:11px; color:#ffc840; letter-spacing:1px; min-height:13px; }
  .lv[disabled] { opacity:.35; cursor:default; }
  .lv.next { border-color:var(--pink); }
  .row { display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
  button.b { background:var(--panel); border:2px solid var(--line); color:var(--txt); border-radius:14px; padding:11px 16px;
    font-size:15px; font-weight:600; cursor:pointer; }
  button.b.main { background:var(--pink); border-color:var(--pink); color:#2a0f1b; }
  button.b:active { transform:scale(.97); }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .top .ttl { font-size:18px; font-weight:700; }
  .top .mv { color:var(--mut); font-size:14px; min-width:90px; text-align:right; }
  .top button { width:44px; height:44px; padding:0; font-size:20px; }
  #msg { min-height:48px; margin:8px 0 4px; padding:10px 12px; border-radius:12px; font-size:15px; line-height:1.3; text-align:center;
    display:flex; align-items:center; justify-content:center; background:transparent; transition:background .2s; }
  #msg.info { background:#202640; } #msg.err { background:#4a1f2a; color:#ffd6dc; } #msg.ok { background:#1d3a2b; color:#c8f5dc; }
  .cwrap { display:flex; justify-content:center; }
  canvas { touch-action:none; border-radius:18px; background:#151827; border:2px solid var(--line); }
  .bar { display:flex; align-items:center; justify-content:center; gap:10px; margin:12px 0 4px; color:var(--mut); font-size:15px; }
  .chip { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:20px; font-weight:700; color:#10121a; transition:background .2s; }
  .actions { display:flex; gap:10px; justify-content:center; margin-top:10px; }
  .actions .b { flex:1; max-width:140px; padding:12px 6px; }
  .overlay { position:fixed; inset:0; background:rgba(8,9,14,.82); display:flex; align-items:center; justify-content:center; padding:20px; z-index:10; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:22px; padding:24px 22px; width:100%; max-width:380px; text-align:center; }
  .card h2 { margin:0 0 10px; font-size:26px; }
  .card p { color:var(--mut); margin:6px 0 14px; }
  .stars { font-size:38px; letter-spacing:6px; color:#ffc840; margin:6px 0; }
  .rules { text-align:left; padding:0; margin:12px 0 18px; list-style:none; counter-reset:r; }
  .rules li { counter-increment:r; margin:10px 0; padding-left:34px; position:relative; line-height:1.35; }
  .rules li::before { content:counter(r); position:absolute; left:0; top:0; width:24px; height:24px; border-radius:50%; background:var(--pink); color:#2a0f1b; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .legend { display:flex; justify-content:center; gap:14px; font-size:13px; color:var(--mut); margin-bottom:6px; }
  #hero { display:block; margin:0 auto; }
  .stat { text-align:center; color:var(--mut); font-size:14px; margin:0 0 14px; }
  .stat b { color:#ffc840; }
  button.b.big { display:block; width:100%; padding:16px; font-size:19px; border-radius:18px; margin:0 0 14px; }
  .best { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 0 6px; }
  .best span { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:5px 12px; font-size:13px; color:var(--txt); }
  .best small { width:100%; text-align:center; color:var(--mut); font-size:12px; margin-bottom:2px; }
  .lv.q { border-style:dashed; color:#4b5170; cursor:default; }
  .lv.next { animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,120,170,.0); } 50% { box-shadow:0 0 0 5px rgba(255,120,170,.28); } }
  .soon { grid-column:1 / -1; text-align:center; color:var(--mut); padding:14px; border:2px dashed var(--line); border-radius:14px; font-size:14px; }
  .b.glow { animation:pulse 1.2s ease-in-out infinite; border-color:var(--pink); }
  .overlay .card { max-height:92vh; overflow-y:auto; }
  .dt { width:34px; height:8px; border-radius:6px; background:var(--line); border:0; padding:0; cursor:pointer; }
  .dt.on { background:var(--pink); }
  canvas.dm { display:block; width:100%; aspect-ratio:9/6; margin-top:8px; border-radius:12px; background:#151827; border:2px solid var(--line); }
  .dmc { min-height:36px; margin-top:6px; font-weight:700; font-size:14px; line-height:1.3; color:var(--txt); }
  .proto { text-align:center; color:#6c7290; font-size:12px; margin-top:18px; }
</style>
</head>
<body>
<div id="app">
  <section id="menu">
    <canvas id="hero"></canvas>
    <h1 id="t_title">Threadlings</h1>
    <p class="tag" id="t_tag"></p>
    <p class="stat" id="t_stat"></p>
    <button class="b main big" id="b_play"></button>
    <div class="best" id="best"></div>
    <div class="grid" id="grid"></div>
    <div class="row">
      <button class="b" id="b_how"></button>
      <button class="b" id="b_prem"></button>
      <button class="b" id="b_lang">ES / EN</button>
      <button class="b" id="b_snd" style="min-width:48px">🎵</button>
      <button class="b" id="b_rank" style="min-width:48px" hidden aria-label="ranking">🏆</button>
    </div>
    <p class="proto" id="t_proto"></p>
  </section>

  <section id="game" hidden>
    <div class="top">
      <button class="b" id="b_back" aria-label="menu">←</button>
      <div class="ttl" id="t_level"></div>
      <div class="mv" id="t_moves"></div>
      <button class="b" id="b_snd2" aria-label="music" style="padding:8px 12px">🎵</button>
      <button class="b" id="b_help" aria-label="help" style="padding:8px 14px;font-weight:800">?</button>
    </div>
    <div id="msg" class="info"></div>
    <div class="cwrap"><canvas id="cv"></canvas></div>
    <div class="bar"><span id="t_thread"></span><span class="chip" id="chip"></span></div>
    <div class="actions">
      <button class="b" id="b_undo"></button>
      <button class="b" id="b_reset"></button>
      <button class="b main" id="b_hint"></button>
    </div>
  </section>
</div>

<div class="overlay" id="ov_win" hidden>
  <div class="card">
    <h2 id="w_title"></h2>
    <div class="stars" id="w_stars"></div>
    <p id="w_text"></p>
    <div class="row" style="margin-top:6px">
      <button class="b" id="w_menu"></button>
      <button class="b" id="w_retry"></button>
      <button class="b main" id="w_next"></button>
    </div>
  </div>
</div>

<div class="overlay" id="ov_ad" hidden>
  <div class="card">
    <h2 id="a_title"></h2>
    <p id="a_text"></p>
    <div class="row" style="margin-top:6px">
      <button class="b" id="a_no"></button>
      <button class="b main" id="a_yes"></button>
    </div>
  </div>
</div>

<div class="overlay" id="ov_lb" hidden>
  <div class="card">
    <h2>🏆 Ranking <small style="font-size:11px;opacity:.6">(maqueta web)</small></h2>
    <div class="row" style="margin:4px 0 8px"><button class="b main" id="lb_all">General</button><button class="b" id="lb_week">Semanal</button></div>
    <ol id="lb_list" style="text-align:left;margin:0;padding-left:26px;line-height:1.9"></ol>
    <div class="row" style="margin-top:10px"><button class="b" id="lb_close">OK</button></div>
  </div>
</div>

<div class="overlay" id="ov_pay" hidden>
  <div class="card">
    <h2 id="p_title"></h2>
    <p id="p_text"></p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
      <button class="b" id="p_ad"></button>
      <button class="b main" id="p_buy"></button>
      <button class="b" id="p_no"></button>
    </div>
  </div>
</div>

<div class="overlay" id="ov_help" hidden>
  <div class="card">
    <h2 id="h_title"></h2>
    <div id="h_rule" style="font-weight:600;min-height:66px;margin:6px 0 10px;line-height:1.35;text-align:left"></div>
    <canvas class="dm" id="dm1" data-k="r1"></canvas><div class="dmc"></div>
    <div id="dm_nav" style="display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 14px"></div>
    <div class="legend" id="h_legend"></div>
    <button class="b main" id="h_close"></button>
  </div>
</div>

<script>
// Hilo core rules + solver (shared by generator and game)
const Hilo = (() => {
  function cross(a, b, c, d) {
    const o = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
    return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
  }
  function crossPoint(a, b, c, d) {
    const den = (b.x - a.x) * (d.y - c.y) - (b.y - a.y) * (d.x - c.x);
    const t = ((c.x - a.x) * (d.y - c.y) - (c.y - a.y) * (d.x - c.x)) / den;
    return { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
  }
  function through(L, i, j) {
    const a = L.pegs[i], b = L.pegs[j];
    const dx = b.x - a.x, dy = b.y - a.y, len2 = dx * dx + dy * dy;
    for (let k = 0; k < L.pegs.length; k++) {
      if (k === i || k === j) continue;
      const p = L.pegs[k];
      const t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
      if (t <= 0.02 || t >= 0.98) continue;
      if (Math.hypot(a.x + t * dx - p.x, a.y + t * dy - p.y) < 0.25) return true;
    }
    return false;
  }
  // path: array of visited peg indices (starts with 0). Returns {ok, reason, at}
  function canMove(L, path, j) {
    const i = path[path.length - 1];
    if (j === i || path.includes(j)) return { ok: false, reason: 'visited' };
    const col = L.pegs[i].c;
    if (L.pegs[j].c === -1) return { ok: false, reason: 'rock' };
    if (j === L.goal && L.stars) {
      if (L.stars.some(k => !path.includes(k))) return { ok: false, reason: 'stars' };
      if (L.cat) { const rem = path.slice(Math.floor(path.length / 3)); if (L.stars.some(k => !rem.includes(k))) return { ok: false, reason: 'stareaten' }; }
    }
    if (j === L.goal && col !== L.goalColor) return { ok: false, reason: 'goalcolor' };
    if (L.alt && j !== L.goal && L.pegs[j].c === col) return { ok: false, reason: 'same' };
    if (L.spider && j === L.spider.route[(path.length - 1) % L.spider.route.length]) return { ok: false, reason: 'spider' };
    if (through(L, i, j)) return { ok: false, reason: 'through' };
    if (L.webs) for (const w of L.webs) {
      if (cross(L.pegs[i], L.pegs[j], L.pegs[w[0]], L.pegs[w[1]])) return { ok: false, reason: 'web', at: crossPoint(L.pegs[i], L.pegs[j], L.pegs[w[0]], L.pegs[w[1]]) };
    }
    const eaten = L.cat ? Math.floor((path.length - 1) / 3) : 0;
    for (let k = eaten; k + 1 < path.length; k++) {
      if (L.pegs[path[k]].c !== col) continue;
      const a = L.pegs[path[k]], b = L.pegs[path[k + 1]];
      if (cross(L.pegs[i], L.pegs[j], a, b)) {
        return { ok: false, reason: 'cross', at: crossPoint(L.pegs[i], L.pegs[j], a, b) };
      }
    }
    return { ok: true };
  }
  function crossings(L, path) {
    let n = 0;
    for (let i = 0; i + 1 < path.length; i++)
      for (let k = 0; k + 1 < i; k++)
        if (cross(L.pegs[path[i]], L.pegs[path[i + 1]], L.pegs[path[k]], L.pegs[path[k + 1]])) n++;
    return n;
  }
  // enumerate solutions from a path prefix. limit caps the count.
  function solve(L, start, limit = 100000) {
    const sols = [];
    const path = start ? start.slice() : [0];
    (function dfs() {
      if (sols.length >= limit) return;
      const last = path[path.length - 1];
      if (last === L.goal) { sols.push(path.slice()); return; }
      for (let j = 0; j < L.pegs.length; j++) {
        if (canMove(L, path, j).ok) { path.push(j); dfs(); path.pop(); }
      }
    })();
    return sols;
  }
  function shortest(L, start) {
    const sols = solve(L, start);
    let best = null;
    for (const s of sols) if (!best || s.length < best.length) best = s;
    return best;
  }
  return { canMove, solve, shortest, crossings, cross };
})();
