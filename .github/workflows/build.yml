name: Build Android AAB
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Generate Android project
        run: npx cap add android
      - run: npx cap sync android
      - name: Build release bundle (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Sign bundle
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > release.keystore
          jarsigner -keystore release.keystore -storepass "$KS_PASS" android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
      - uses: actions/upload-artifact@v4
        with:
          name: threadlings-aab
          path: android/app/build/outputs/bundle/release/*.aab
