name: Build Android AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Patch Play Games plugin for Capacitor 8 toolchain
        run: |
          f=node_modules/@idleflowgames/capacitor-play-games/android/build.gradle
          python3 - "$f" <<'PY'
          import sys,re
          p=sys.argv[1]; s=open(p).read()
          s=s.replace("import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n","")
          s=re.sub(r"buildscript \{.*?\n\}\n","buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20' }\n}\n",s,count=1,flags=re.S)
          s=s.replace("apply plugin: 'com.android.library'","apply plugin: 'com.android.library'\napply plugin: 'kotlin-android'")
          s=re.sub(r"kotlin \{.*?\n\}\n","android.kotlinOptions { jvmTarget = '21' }\n",s,count=1,flags=re.S)
          open(p,'w').write(s)
          PY
          cat $f | head -30
      - name: Generate Android project
        run: npx cap add android
      - name: Generate launcher icons
        run: npx --yes @capacitor/assets generate --android --assetPath assets
      - name: Configure AdMob app id
        run: |
          sed -i 's#</resources>#    <string name="admob_app_id">ca-app-pub-8984191487406696~7524980143</string>\n</resources>#' android/app/src/main/res/values/strings.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#</resources>#    <string name="game_services_project_id" translatable="false">836169048593</string>\n</resources>#' android/app/src/main/res/values/strings.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.games.APP_ID" android:value="@string/game_services_project_id"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "admob\|APPLICATION_ID" android/app/src/main/res/values/strings.xml android/app/src/main/AndroidManifest.xml
      - name: Set version code
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build release bundle (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease
      - name: Sign bundle
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > release.keystore
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$KS_PASS" android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
      - name: Build signed APK (direct download)
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        working-directory: android
        run: |
          ./gradlew assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNS=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNS" /tmp/aligned.apk
          $BT/apksigner sign --ks ../release.keystore --ks-pass pass:"$KS_PASS" --ks-key-alias "$KEY_ALIAS" --out /tmp/threadlings.apk /tmp/aligned.apk
          $BT/apksigner verify /tmp/threadlings.apk
      - name: Publish APK as GitHub Release
        if: ${{ env.KS_B64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest /tmp/threadlings.apk --title "Threadlings (APK, build ${{ github.run_number }})" --notes "Direct download APK. Enable installing from this source when Android asks." --latest
      - uses: actions/upload-artifact@v4
        with:
          name: threadlings-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Publish AAB on release-aab branch
        if: env.KS_B64 != ''
        run: |
          mkdir /tmp/aabpub && cp android/app/build/outputs/bundle/release/app-release.aab /tmp/aabpub/threadlings.aab
          cd /tmp/aabpub && git init -q -b release-aab && git add threadlings.aab
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "AAB build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release-aab
